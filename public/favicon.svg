<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wheel segments (6 colors) -->
  <!-- Segment 1: red, 0-60deg -->
  <path d="M50,50 L50,5 A45,45 0 0,1 88.97,27.5 Z" fill="#ef4444"/>
  <!-- Segment 2: blue, 60-120deg -->
  <path d="M50,50 L88.97,27.5 A45,45 0 0,1 88.97,72.5 Z" fill="#3b82f6"/>
  <!-- Segment 3: green, 120-180deg -->
  <path d="M50,50 L88.97,72.5 A45,45 0 0,1 50,95 Z" fill="#22c55e"/>
  <!-- Segment 4: amber, 180-240deg -->
  <path d="M50,50 L50,95 A45,45 0 0,1 11.03,72.5 Z" fill="#f59e0b"/>
  <!-- Segment 5: violet, 240-300deg -->
  <path d="M50,50 L11.03,72.5 A45,45 0 0,1 11.03,27.5 Z" fill="#8b5cf6"/>
  <!-- Segment 6: pink, 300-360deg -->
  <path d="M50,50 L11.03,27.5 A45,45 0 0,1 50,5 Z" fill="#ec4899"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Divider lines -->
  <line x1="50" y1="50" x2="50" y2="5" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="88.97" y2="27.5" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="88.97" y2="72.5" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="50" y2="95" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="11.03" y2="72.5" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="11.03" y2="27.5" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="8" fill="#1e293b"/>
  <circle cx="50" cy="50" r="4" fill="white"/>
  <!-- Pointer (triangle at top) -->
  <polygon points="50,0 44,12 56,12" fill="#1e293b"/>
</svg>

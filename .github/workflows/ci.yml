name: CI

on:
  # 変更が文書だけなら workflow ごと動かさない。lint / test / build を必須チェックにすると、
  # skip した PR は報告待ちのまま止まるので、必須にするときはこの除外を外してジョブ側で分岐する
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  # PR の CI はマージ前の head で動く。マージ後の develop は別に確かめる
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # どれが落ちたかを一度に見たいので、1 つ落ちても残りを止めない
      fail-fast: false
      matrix:
        # build は tsc -b を先頭で走らせるので型検査も兼ねる
        task: [lint, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-node の cache: pnpm が pnpm コマンドを要るので、setup-node より前に置く。版は packageManager から読む
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.task }}
